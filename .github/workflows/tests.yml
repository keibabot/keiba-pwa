name: Research boundary tests
on:
  push:
    branches: [main]
    paths: ['research/**', 'tests/**', 'trio_model.py', 'trio_engine.py', 'view-state.js', 'requirements-research.txt']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/view-state.test.cjs
