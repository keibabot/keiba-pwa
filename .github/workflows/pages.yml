name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build versioned site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          node --test tests/view-state.test.cjs
          cp index.html styles.css app.js view-state.js icon.svg manifest.webmanifest sw.js research.json model_report.json audit_report.json latest.json history.json health.json _site/
          BUILD_VERSION="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" _site/index.html
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" _site/sw.js
          echo "Built PWA version ${BUILD_VERSION}"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
